          $ref: '#/components/schemas/TripSeatMap'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - success
      - data
    SeatStatusMessage:
      type: object
      properties:
        action:
          type: string
          enum:
          - status_changed
        trip_id:
          type: string
          format: uuid
        seat_numbers:
          type: array
          items:
            type: string
        new_status:
          type: string
          enum:
          - held
          - booked
          - available
      required:
      - action
      - trip_id
      - seat_numbers
      - new_status
      description: Frame sent over the seat-updates WebSocket. Documented here so clients can model it; the spec cannot describe WebSocket frames
        natively.
