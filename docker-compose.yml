services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: slbus
      POSTGRES_PASSWORD: slbus
      POSTGRES_DB: slbus
    ports:
      - "5432:5432"
    volumes:
      - slbus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slbus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  slbus_postgres_data:
