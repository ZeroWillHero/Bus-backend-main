      description: 'Public, like search, so passengers can pick seats before logging in. Returns the bus''s seat map for a bookable trip (scheduled, approved operator) with each seat''s current status and fare. `row`/`col` are the operator''s seat-map grid; gaps in `col` are aisles. Subscribe to `/v1/ws/trips/{tripID}/seats` for changes after this snapshot. `seats` is empty when the bus has no seat map.'
