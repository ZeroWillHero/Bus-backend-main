  /v1/tickets/{qrToken}/check-in:
    post:
      tags:
      - Tickets
      operationId: checkInTicket
      summary: Check a passenger in by QR token
      description: '**Note:** the booking endpoints do not use the standard `{success, data}` envelope. Success responses are the bare object,
        and errors are a bare `{code, message}` (`BookingError`).


        **Roles:** `operator_staff`, `operator_admin`'
      security:
      - bearerAuth: []
      parameters:
      - name: qrToken
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Checked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResult'
        '400':
          description: '`INVALID_QR_TOKEN`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: '`TICKET_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '409':
          description: '`TICKET_ALREADY_CHECKED_IN`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
  /v1/ws/trips/{tripID}/seats:
    get:
      tags:
      - Realtime
      operationId: subscribeSeatUpdates
      summary: Live seat status over WebSocket
      description: WebSocket upgrade. Not callable from Swagger UI and not generated into client code. Public, like the seat map, so passengers
        can watch seats before logging in; no token is needed. A client may still send an access token (any role) in the `token` query parameter
        or the `Sec-WebSocket-Protocol` header, and if it does the token must be valid. The server then streams text frames, each a JSON `SeatStatusMessage`.
        The connection closes after 15 minutes.
      security: []
      parameters:
      - name: tripID
        in: path
        required: true
        description: Trip id
        schema:
          type: string
          format: uuid
      - name: token
        in: query
        required: false
        description: Optional access token (JWT). Rejected with 401 if present but invalid.
        schema:
          type: string
      responses:
        '101':
          description: Switching protocols; frames are `SeatStatusMessage` JSON
        '400':
          description: Missing or malformed tripID
        '401':
          description: Token sent but invalid
      x-websocket: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `meta.nextCursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Page size (default 20).
      schema:
        type: integer
        minimum: 1
    OperatorIdOrMe:
      name: id
      in: path
      required: true
      description: Operator UUID, or `me` for the caller's own operator. Operator-side roles may only read their own operator; `platform_admin` must pass a UUID.
      schema:
        type: string
    Tz:
      name: tz
      in: query
      description: IANA time zone used to cut calendar days.
      schema:
        type: string
        default: Asia/Colombo
  responses:
    BadRequest:
      description: Request body is not valid JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: VALIDATION_FAILED
              message: Request body is not valid JSON.
    Unauthorized:
      description: Missing, invalid or expired access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: AUTH_TOKEN_INVALID
              message: Missing, invalid or expired access token.
    Forbidden:
      description: You don't have permission to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: AUTH_FORBIDDEN
              message: You don't have permission to perform this action.
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Resource not found.
    Conflict:
      description: State conflict, e.g. an invalid status transition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: INVALID_STATUS_TRANSITION
              message: State conflict, e.g. an invalid status transition.
    ValidationFailed:
      description: Validation failed. See `error.fields` for per-field issues.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: VALIDATION_FAILED
              message: Validation failed. See `error.fields` for per-field issues.
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: AUTH_OTP_RATE_LIMITED
              message: Too many requests.
  schemas:
    Meta:
      type: object
      properties:
        requestId:
          type: string
    PageMeta:
      type: object
      properties:
        requestId:
          type: string
        nextCursor:
          type: string
          description: Pass as `cursor` to fetch the next page.
        hasMore:
          type: boolean
    FieldError:
      type: object
      properties:
        field:
          type: string
        issue:
          type: string
      required:
      - field
      - issue
    ApiError:
      type: object
      properties:
        code:
          type: string
          description: Stable, namespaced error code.
          example: VALIDATION_FAILED
        message:
          type: string
          description: Safe to show to the end user.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      required:
      - code
      - message
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          description: Always `false`.
        error:
          $ref: '#/components/schemas/ApiError'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - success
      - error
    BookingError:
      type: object
      properties:
        code:
          type: string
          example: BOOKING_NOT_FOUND
        message:
          type: string
      required:
      - code
      description: Bare error body used by the booking endpoints (no envelope). Some responses may have an empty or plain-text body.
    EmptyData:
      type: object
      properties: {}
      description: Empty object.
    EmptyResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Always `true`.
        data:
          $ref: '#/components/schemas/EmptyData'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - success
      - data
    HealthData:
      type: object
      properties:
        status:
          type: string
          example: ok
      required:
      - status
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Always `true`.
        data:
          $ref: '#/components/schemas/HealthData'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - success
      - data
    Role:
      type: string
      enum:
      - passenger
      - operator_staff
      - operator_admin
      - finance_admin
      - support
      - platform_admin
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        operatorId:
          type: string
          format: uuid
          description: Present for operator roles.
      required:
      - accessToken
      - refreshToken
      - role
    TokenPairResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Always `true`.
        data:
          $ref: '#/components/schemas/TokenPair'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - success
      - data
    RegisterOperatorRequest:
      type: object
      properties:
        businessName:
          type: string
        businessRegNo:
          type: string
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
        registrationDocUrl:
          type: string
        password:
          type: string
          format: password
          minLength: 10
      required:
      - businessName
      - businessRegNo
      - contactEmail
      - password
    RegisterOperatorResult:
      type: object
      properties:
        operatorId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          type: string
          example: pending
      required:
      - operatorId
      - userId
      - status
    RegisterOperatorResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Always `true`.
        data:
          $ref: '#/components/schemas/RegisterOperatorResult'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - success
      - data
    RequestOtpRequest:
      type: object
      properties:
        phone:
          type: string
          example: '+94771234567'
      required:
      - phone
    VerifyOtpRequest:
      type: object
      properties:
        phone:
          type: string
        code:
          type: string
      required:
      - phone
      - code
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        deviceFingerprint:
          type: string
      required:
      - email
      - password
    LoginResult:
      type: object
      properties:
        mfaChallengeRequired:
          type: boolean
        mfaEnrollNeeded:
          type: boolean
        preAuthToken:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        operatorId:
          type: string
          format: uuid
      description: Either an MFA challenge (`mfaChallengeRequired` + `preAuthToken`) or a token pair, never both.
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Always `true`.
        data:
          $ref: '#/components/schemas/LoginResult'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - success
      - data
