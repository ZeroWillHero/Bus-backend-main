      operationId: cancelBooking
      summary: Cancel a booking
      description: '**Note:** the booking endpoints do not use the standard `{success, data}` envelope. Success responses are the bare object,
        and errors are a bare `{code, message}` (`BookingError`).


        **Roles:** `passenger`'
      security:
      - bearerAuth: []
