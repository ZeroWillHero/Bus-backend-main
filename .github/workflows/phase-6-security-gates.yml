name: Phase 6 Security & Hardening Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    name: Security Scanning (OWASP Top 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Go Vulnerability Scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Go Dependency Verification
        run: go mod verify

      - name: Dependency Audit (nancy)
        run: |
          go list -json -m all | nancy sleuth --loud

      - name: SQL Injection Prevention (sqlc validation)
        run: |
          # Verify all database queries are sqlc-generated (no raw pgx.Query)
          if grep -r "pgx\.Query\|pgx\.QueryRow" internal/ --include="*.go" | grep -v ".sqlc\|test\.go"; then
            echo "❌ FAIL: Raw pgx queries found (must use sqlc)"
            exit 1
          fi
          echo "✓ All database queries are parameterized via sqlc"

      - name: Secrets Detection (truffleHog)
        run: |
          pip install truffleHog
          truffleHog filesystem . --json 2>/dev/null | jq 'select(.verified==true)' && echo "❌ FAIL: Hardcoded secrets found" && exit 1 || echo "✓ No hardcoded secrets detected"

  rls-isolation-tests:
    name: Row-Level Security (RLS) Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: slbus_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Install PostgreSQL Client
        run: apt-get update && apt-get install -y postgresql-client

      - name: Apply Database Schema
        env:
          PGPASSWORD: testpass
        run: |
          psql -h localhost -U postgres -d slbus_test -a -f db/migrations/*.up.sql

      - name: Run RLS Isolation Tests
        env:
          DATABASE_URL: postgres://postgres:testpass@localhost:5432/slbus_test
        run: |
          go test ./internal/*/repository/*rls_test.go -v -race

  booking-domain-tests:
    name: Booking Domain & State Machine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Booking Domain Tests (State Machine, Validation)
        run: |
          go test ./internal/booking/domain -v -race

          # Verify specific state machine scenarios
          go test -run "TestCanTransition|TestGenerateQRToken|TestFareValidation" ./internal/booking/domain -v

  payment-security-tests:
    name: Payment Security (Fare Tampering Tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: slbus_test
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Apply Schema
        env:
          PGPASSWORD: testpass
        run: psql -h localhost -U postgres -d slbus_test -a -f db/migrations/*.up.sql

      - name: Payment Tampering Tests
        env:
          DATABASE_URL: postgres://postgres:testpass@localhost:5432/slbus_test
        run: |
          go test -run "TestServerSideFareRecomputation|TestFareTampering" ./internal/booking/service -v

  concurrency-tests:
    name: Seat-Hold Concurrency (Critical Test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: slbus_test
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Apply Schema
        env:
          PGPASSWORD: testpass
        run: psql -h localhost -U postgres -d slbus_test -a -f db/migrations/*.up.sql

      - name: Seat-Hold Concurrency Test (CRITICAL)
        env:
          DATABASE_URL: postgres://postgres:testpass@localhost:5432/slbus_test
        run: |
          # This test MUST pass — validates no overselling under concurrent load
          go test -run "TestNoOverselling|TestConcurrentHolds" ./internal/fleet/repository -v -race -timeout 30s

  ledger-immutability-tests:
    name: Finance Ledger Immutability Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: slbus_test
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Apply Schema
        env:
          PGPASSWORD: testpass
        run: psql -h localhost -U postgres -d slbus_test -a -f db/migrations/*.up.sql

      - name: Ledger Immutability Tests
        env:
          DATABASE_URL: postgres://postgres:testpass@localhost:5432/slbus_test
        run: |
          go test -run "TestJournalEntriesImmutable|TestTrialBalanceAlwaysBalances|TestFareSplitRounding" ./internal/finance/service -v

  outbox-reliability-tests:
    name: Outbox Pattern Reliability Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: slbus_test
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Apply Schema
        env:
          PGPASSWORD: testpass
        run: psql -h localhost -U postgres -d slbus_test -a -f db/migrations/*.up.sql

      - name: Outbox Pattern Tests
        env:
          DATABASE_URL: postgres://postgres:testpass@localhost:5432/slbus_test
        run: |
          go test -run "TestOutboxEventCreatedWithBooking|TestRelayIdempotency|TestFailedRelayRetry" ./internal/platform/outbox -v

  rate-limiting-tests:
    name: Rate Limiting (OTP, API Endpoints)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Rate Limit Tests
        run: |
          go test -run "TestOTPRequestRateLimit|TestAPIEndpointRateLimit" ./internal/platform/httpx -v

  tls-verification:
    name: TLS Configuration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify TLS Configuration in Code
        run: |
          # Check that production builds enforce TLS
          if grep -r "InsecureSkipVerify.*true" cmd/ internal/ --include="*.go"; then
            echo "❌ FAIL: TLS verification is disabled in production code"
            exit 1
          fi
          echo "✓ TLS verification is enforced"

  static-analysis:
    name: Go Static Analysis (vet, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Go Vet
        run: go vet ./...

      - name: Go Fmt Check
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "❌ FAIL: Go code is not formatted (run 'gofmt -s -w .')"
            gofmt -s -d .
            exit 1
          fi
          echo "✓ Go code is properly formatted"

      - name: Go Build
        run: |
          go build ./cmd/server
          go build ./cmd/worker

  integration-tests:
    name: Integration Tests (End-to-End Flows)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: slbus_test
        ports:
          - 5432:5432
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Apply Schema
        env:
          PGPASSWORD: testpass
        run: psql -h localhost -U postgres -d slbus_test -a -f db/migrations/*.up.sql

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgres://postgres:testpass@localhost:5432/slbus_test
          REDIS_URL: redis://localhost:6379
        run: |
          go test -run "^TestIntegration" ./internal/booking/http -v

  report-security-findings:
    name: Report Security Findings
    runs-on: ubuntu-latest
    if: failure()
    needs: [security-scan, rls-isolation-tests, payment-security-tests, concurrency-tests]
    steps:
      - name: Create GitHub Issue (Security Gate Failure)
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🔒 Phase 6 Security Gate Failed",
              body: `A security test failed in Phase 6 hardening:\n\nFailed Jobs:\n- Security Scan\n- RLS Tests\n- Payment Security\n- Concurrency Tests\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["security", "phase-6"]
            })

  gate-summary:
    name: Phase 6 Security Gate Summary
    runs-on: ubuntu-latest
    needs: [security-scan, rls-isolation-tests, booking-domain-tests, payment-security-tests, concurrency-tests, ledger-immutability-tests, outbox-reliability-tests, rate-limiting-tests, tls-verification, static-analysis, integration-tests]
    if: always()
    steps:
      - name: Phase 6 Gate Status
        run: |
          if [ "${{ needs.concurrency-tests.result }}" != "success" ]; then
            echo "❌ CRITICAL FAILURE: Seat-hold concurrency test failed"
            exit 1
          fi

          if [ "${{ needs.ledger-immutability-tests.result }}" != "success" ]; then
            echo "❌ CRITICAL FAILURE: Ledger immutability test failed"
            exit 1
          fi

          if [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "❌ SECURITY FAILURE: Vulnerability scan detected issues"
            exit 1
          fi

          echo "✅ Phase 6 Security Gates: ALL PASSED"
          echo ""
          echo "Passed Gates:"
          echo "  ✓ Security Scan (no CVEs, no secrets)"
          echo "  ✓ RLS Isolation (zero cross-tenant leaks)"
          echo "  ✓ Booking State Machine (all transitions valid)"
          echo "  ✓ Payment Security (fare tampering tests)"
          echo "  ✓ Concurrency (zero overselling under load)"
          echo "  ✓ Ledger Immutability (journal INSERT-only)"
          echo "  ✓ Outbox Reliability (100% delivery)"
          echo "  ✓ Rate Limiting (OTP/API throttling)"
          echo "  ✓ TLS Verification (no InsecureSkipVerify)"
          echo "  ✓ Static Analysis (vet, fmt, build)"
          echo "  ✓ Integration Tests (end-to-end flows)"
          echo ""
          echo "System is ready for Phase 6 hardening and launch prep."
