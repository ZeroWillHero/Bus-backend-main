# Generated from the handlers in internal/*/http and cmd/server/main.go, then maintained by hand.
openapi: 3.0.3
info:
  title: SL-Bus API
  version: 1.0.0
  description: 'Backend API for SL-Bus.


    **Response format.** Most endpoints reply with an envelope: `{ "success": true, "data": ..., "meta": ... }` on success and `{ "success": false,
    "error": { "code", "message", "fields?" } }` on failure. Paginated lists put `nextCursor` and `hasMore` in `meta`. The **booking and ticket
    endpoints are the exception**: they return the bare object and a bare `{code, message}` error. Each is marked in its description.


    **Authentication.** Send `Authorization: Bearer <accessToken>`. Tokens come from the `/v1/auth/*` endpoints. Each protected endpoint lists
    the roles that may call it.


    **Source of truth.** This file is hand-maintained (`api/openapi.yaml`) and is served at `/openapi.yaml`. A Go test fails if a route is added
    without being documented here.'
servers:
- url: https://api.slbus.codescapelabs.com
  description: Production
- url: http://localhost:8080
  description: Local development
tags:
- name: Platform
- name: Auth
- name: Operators (admin)
- name: Operator insights
- name: Fleet
- name: Search
- name: Bookings
- name: Tickets
- name: Realtime
security:
- bearerAuth: []
paths:
  /healthz:
    get:
      tags:
      - Platform
      operationId: healthCheck
      summary: Liveness/readiness check
      description: Pings the database. Returns 503 `PLATFORM_DB_UNAVAILABLE` when it is unreachable.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/auth/register:
    post:
      tags:
      - Auth
      operationId: registerOperator
      summary: Register an operator account
      description: Creates a PENDING operator and its first user. A platform admin must approve it before the operator can use the fleet endpoints.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOperatorRequest'
      responses:
        '201':
          description: Operator registered, pending approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterOperatorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/auth/otp/request:
    post:
      tags:
      - Auth
      operationId: requestOtp
      summary: Request a login OTP for a passenger phone number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOtpRequest'
      responses:
        '202':
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/auth/otp/verify:
    post:
      tags:
      - Auth
      operationId: verifyOtp
      summary: Verify an OTP and sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: Operator/staff/admin email + password login
      description: Returns tokens directly, or an MFA challenge. When `mfaChallengeRequired` is true, finish with `/v1/auth/mfa/verify` (and `/v1/auth/mfa/enroll`
        first if `mfaEnrollNeeded`) using the `preAuthToken`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in, or MFA required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/auth/mfa/enroll:
    post:
      tags:
      - Auth
      operationId: enrollMfa
      summary: Start TOTP enrollment
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollMfaRequest'
      responses:
        '200':
          description: TOTP secret to scan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollMfaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/auth/mfa/verify:
    post:
      tags:
      - Auth
      operationId: verifyMfa
      summary: Complete login with a TOTP code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyMfaRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/auth/token/refresh:
    post:
      tags:
      - Auth
      operationId: refreshToken
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      summary: Revoke a refresh token
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/auth/sessions:
    get:
      tags:
      - Auth
      operationId: listSessions
      summary: List the caller's active sessions
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/sessions/{id}:
    delete:
      tags:
      - Auth
      operationId: revokeSession
      summary: Revoke one of the caller's sessions
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Session id
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/operators:
    get:
      tags:
      - Operators (admin)
      operationId: listOperators
      summary: List operators by status
      description: '**Roles:** `platform_admin`'
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        description: Defaults to `pending`.
        schema:
          $ref: '#/components/schemas/OperatorStatus'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Operators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/operators/me:
    get:
      tags:
      - Operators
      operationId: getOwnOperator
      summary: Get the caller's own operator record
      description: Returns 404 for callers without an operator (e.g. `platform_admin`).
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Operator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No operator for this caller
  /v1/operators/{id}/approve:
    post:
      tags:
      - Operators (admin)
      operationId: approveOperator
      summary: Approve a pending operator
      description: '**Roles:** `platform_admin`'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Operator id
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Updated operator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/operators/{id}/reject:
    post:
      tags:
      - Operators (admin)
      operationId: rejectOperator
      summary: Reject a pending operator
      description: '**Roles:** `platform_admin`'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Operator id
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Updated operator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/operators/{id}/suspend:
    post:
      tags:
      - Operators (admin)
      operationId: suspendOperator
      summary: Suspend an approved operator
      description: '**Roles:** `platform_admin`'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Operator id
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Updated operator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/operators/{id}/reactivate:
    post:
      tags:
      - Operators (admin)
      operationId: reactivateOperator
      summary: Reactivate a suspended operator
      description: '**Roles:** `platform_admin`'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Operator id
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Updated operator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/operators/{id}/dashboard:
    get:
      tags:
      - Operator insights
      operationId: getOperatorDashboard
      summary: Operator dashboard summary
      description: 'Fleet counts, today''s trips and seat sales, and "needs attention" alerts for one operator, computed server-side. `{id}` may be `me`. Seats counted as `seatsSold` are booked seats on today''s non-cancelled trips; held (unpaid) seats are reported separately in `seatsHeld`. `today.trips` excludes cancelled trips, which are counted in `today.cancelledTrips`. "Today" is the calendar day in `tz` (default `Asia/Colombo`). `busesWithoutSeatMap` counts active buses only.


        **Roles:** `operator_admin`, `operator_staff`, `platform_admin` (platform admins must pass an operator id, not `me`)'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OperatorIdOrMe'
      - $ref: '#/components/parameters/Tz'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorDashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/operators/{id}/analytics/series:
    get:
      tags:
      - Operator insights
      operationId: getOperatorRevenueSeries
      summary: Revenue and bookings time series
      description: 'One zero-filled point per local date in `[from, to]` (max 92 days, else `ANALYTICS_RANGE_TOO_LARGE`). `{id}` may be `me`.


        **Revenue definition.** `grossRevenue` is the total of bookings confirmed on that day (bucketed by `confirmed_at`); `refunds` is the total of confirmed bookings cancelled that day (bucketed by `cancelled_at`; always `0.00` until a refund flow exists); `netRevenue = grossRevenue - refunds`. Platform commission and gateway fees are not deducted. Held (unpaid) bookings never count. Days are cut at midnight in `tz`.


        **Roles:** `operator_admin`, `finance_admin`, `platform_admin` (not `operator_staff`)'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OperatorIdOrMe'
      - name: from
        in: query
        required: true
        description: First date, inclusive (YYYY-MM-DD).
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        description: Last date, inclusive (YYYY-MM-DD).
        schema:
          type: string
          format: date
      - name: granularity
        in: query
        description: Only `day` is supported.
        schema:
          type: string
          enum:
          - day
          default: day
      - $ref: '#/components/parameters/Tz'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSeriesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/operators/{id}/analytics/summary:
    get:
      tags:
      - Operator insights
      operationId: getOperatorRevenueSummary
      summary: Period revenue summary with comparison
      description: 'Totals for a date range with an optional comparison period, cancellation metrics, average occupancy and the top 5 routes by revenue. Use `period=month_to_date` as a shortcut (this month so far against the same span of the previous month), or pass `from`/`to` and optionally `compareFrom`/`compareTo`. Revenue is defined as in the series endpoint. `comparison.deltaPercent` is `null` when the comparison period has no revenue. `averageOccupancy` is booked seats over total seats on non-cancelled trips departing in the period. `{id}` may be `me`.


        **Roles:** `operator_admin`, `finance_admin`, `platform_admin` (not `operator_staff`)'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OperatorIdOrMe'
      - name: period
        in: query
        description: Shortcut; use instead of `from`/`to`.
        schema:
          type: string
          enum:
          - month_to_date
      - name: from
        in: query
        required: false
        description: First date, inclusive. Required unless `period` is given.
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        description: Last date, inclusive. Required unless `period` is given.
        schema:
          type: string
          format: date
      - name: compareFrom
        in: query
        required: false
        description: Start of the comparison period. Give together with `compareTo`.
        schema:
          type: string
          format: date
      - name: compareTo
        in: query
        required: false
        description: End of the comparison period.
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/Tz'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/operators/{id}/activity:
    get:
      tags:
      - Operator insights
      operationId: listOperatorActivity
      summary: Recent activity feed
      description: 'Newest-first events for the operator as structured fields (not display text), so the app can phrase and localise them. Event `type` is one of `booking_confirmed`, `booking_cancelled`, `trip_created`, `trip_cancelled`, `check_in`, `payout_initiated`, `payout_executed`, `operator_approved`. No passenger personal data is included. `operator_staff` see no amounts and no payout events. `{id}` may be `me`.


        **Roles:** `operator_admin`, `operator_staff`, `platform_admin`'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OperatorIdOrMe'
      - $ref: '#/components/parameters/Cursor'
      - name: limit
        in: query
        description: Page size (default 20, max 100).
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/fleet/buses:
    post:
      tags:
      - Fleet
      operationId: createBus
      summary: Create a bus
      description: '**Roles:** `operator_admin`, `platform_admin`'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusRequest'
      responses:
        '201':
          description: Bus created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    get:
      tags:
      - Fleet
      operationId: listBuses
      summary: List buses
      description: '**Roles:** `operator_admin`, `operator_staff`, `platform_admin`'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Buses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/fleet/buses/{id}:
    get:
      tags:
      - Fleet
      operationId: getBus
      summary: Get a bus
      description: '**Roles:** `operator_admin`, `operator_staff`, `platform_admin`'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Bus id
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Fleet
      operationId: updateBus
      summary: Update a bus (full replace of editable fields)
      description: '**Roles:** `operator_admin`, `platform_admin`'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Bus id
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/fleet/buses/{id}/seat-map:
    get:
      tags:
      - Fleet
      operationId: getSeatMap
      summary: Get a bus's seat map
      description: '**Roles:** `operator_admin`, `operator_staff`, `platform_admin`'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Bus id
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatMapResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Fleet
      operationId: replaceSeatMap
      summary: Replace a bus's seat map
      description: '**Roles:** `operator_admin`, `platform_admin`'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Bus id
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceSeatMapRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatMapResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/fleet/routes:
    post:
      tags:
      - Fleet
      operationId: createRoute
      summary: Create a route
      description: '**Roles:** `operator_admin`, `platform_admin`'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRouteRequest'
      responses:
        '201':
          description: Route created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    get:
      tags:
      - Fleet
      operationId: listRoutes
      summary: List routes
      description: '**Roles:** `operator_admin`, `operator_staff`, `platform_admin`'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Routes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/fleet/routes/{id}:
    get:
      tags:
      - Fleet
      operationId: getRoute
      summary: Get a route
      description: '**Roles:** `operator_admin`, `operator_staff`, `platform_admin`'
      security:
