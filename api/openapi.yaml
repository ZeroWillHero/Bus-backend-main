          type: string
          format: date
          description: YYYY-MM-DD, UTC
        weekdays:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          description: 0 = Sunday .. 6 = Saturday. Empty means every day.
        timeOfDay:
          type: string
          example: 06:30
          description: HH:MM, UTC
      required:
      - startDate
      - endDate
      - timeOfDay
    CreateTripsRequest:
      type: object
      properties:
        routeId:
          type: string
          format: uuid
        busId:
          type: string
          format: uuid
        departureAt:
          type: string
          format: date-time
          description: One-off trip (RFC 3339). Use this or `recurrence`.
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        baseFare:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
        fareOverrides:
          type: object
          additionalProperties:
            type: number
            format: double
          description: Fare by seat type, overriding `baseFare`.
      required:
      - routeId
      - busId
      - baseFare
    RescheduleTripRequest:
      type: object
      properties:
        departureAt:
          type: string
          format: date-time
      required:
      - departureAt
    UpdateTripFaresRequest:
      type: object
      properties:
        fares:
          type: object
          minProperties: 1
          additionalProperties:
            type: number
            format: double
          description: Fare by seat type.
      required:
      - fares
    TripFares:
      type: object
      additionalProperties:
        type: number
        format: double
      description: Fare by seat type.
    TripFaresResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Always `true`.
        data:
          $ref: '#/components/schemas/TripFares'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - success
      - data
    SearchResult:
      type: object
      properties:
        tripId:
          type: string
          format: uuid
        operatorName:
          type: string
        origin:
          type: string
        destination:
          type: string
        departureAt:
          type: string
          format: date-time
        busClass:
          type: string
        amenities:
          type: object
          additionalProperties: true
          description: 'Free-form amenities, e.g. `{"wifi": true, "ac": true}`.'
        baseFare:
          type: number
          format: double
        availableSeats:
          type: integer
      required:
      - tripId
      - operatorName
      - origin
      - destination
      - departureAt
      - busClass
      - baseFare
      - availableSeats
    SearchResultListResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Always `true`.
        data:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        meta:
          $ref: '#/components/schemas/PageMeta'
      required:
      - success
      - data
    BookingStatus:
      type: string
      enum:
      - held
      - confirmed
      - cancelled
      - paid_but_expired
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/BookingStatus'
        totalAmount:
          type: number
          format: double
        holdExpiresAt:
          type: string
          format: date-time
          description: Present while status is `held`.
      required:
      - id
      - tripId
      - status
      - totalAmount
    BookingSeatRequest:
      type: object
      properties:
        seatNumber:
          type: string
        passengerName:
          type: string
        passengerNic:
          type: string
        fareAmount:
          type: number
          format: double
          description: Ignored. Fares are computed server-side.
      required:
      - seatNumber
      - passengerName
    CreateBookingRequest:
      type: object
      properties:
        tripId:
          type: string
          format: uuid
        seats:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BookingSeatRequest'
      required:
      - tripId
      - seats
    ConfirmBookingRequest:
      type: object
      properties:
        paymentRef:
          type: string
      required:
      - paymentRef
    CheckInResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        checkedIn:
          type: boolean
      required:
      - id
      - bookingId
      - checkedIn
    SeatStatusMessage:
      type: object
      properties:
        action:
          type: string
          enum:
          - status_changed
        trip_id:
          type: string
          format: uuid
        seat_numbers:
          type: array
          items:
            type: string
        new_status:
          type: string
          enum:
          - held
          - booked
          - available
      required:
      - action
      - trip_id
      - seat_numbers
      - new_status
      description: Frame sent over the seat-updates WebSocket. Documented here so clients can model it; the spec cannot describe WebSocket frames
        natively.
