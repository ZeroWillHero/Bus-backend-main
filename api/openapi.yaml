        the operator must be approved.


        **Roles:** `operator_admin`, `platform_admin`'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripsRequest'
      responses:
