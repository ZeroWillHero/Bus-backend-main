# Generated from the handlers in internal/*/http and cmd/server/main.go, then maintained by hand.
openapi: 3.0.3
info:
  title: SL-Bus API
  version: 1.0.0
  description: 'Backend API for SL-Bus.


    **Response format.** Most endpoints reply with an envelope: `{ "success": true, "data": ..., "meta": ... }` on success and `{ "success": false,
    "error": { "code", "message", "fields?" } }` on failure. Paginated lists put `nextCursor` and `hasMore` in `meta`. The **booking and ticket
    endpoints are the exception**: they return the bare object and a bare `{code, message}` error. Each is marked in its description.


    **Authentication.** Send `Authorization: Bearer <accessToken>`. Tokens come from the `/v1/auth/*` endpoints. Each protected endpoint lists
    the roles that may call it.


    **Source of truth.** This file is hand-maintained (`api/openapi.yaml`) and is served at `/openapi.yaml`. A Go test fails if a route is added
    without being documented here.'
servers:
- url: https://api.slbus.codescapelabs.com
  description: Production
- url: http://localhost:8080
  description: Local development
tags:
- name: Platform
- name: Auth
- name: Operators (admin)
- name: Fleet
- name: Search
- name: Bookings
- name: Tickets
- name: Realtime
security:
- bearerAuth: []
paths:
  /healthz:
    get:
      tags:
      - Platform
      operationId: healthCheck
      summary: Liveness/readiness check
      description: Pings the database. Returns 503 `PLATFORM_DB_UNAVAILABLE` when it is unreachable.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/auth/register:
    post:
      tags:
      - Auth
      operationId: registerOperator
      summary: Register an operator account
      description: Creates a PENDING operator and its first user. A platform admin must approve it before the operator can use the fleet endpoints.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOperatorRequest'
      responses:
        '201':
          description: Operator registered, pending approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterOperatorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/auth/otp/request:
    post:
      tags:
      - Auth
      operationId: requestOtp
      summary: Request a login OTP for a passenger phone number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOtpRequest'
      responses:
        '202':
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/auth/otp/verify:
    post:
      tags:
      - Auth
      operationId: verifyOtp
      summary: Verify an OTP and sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: Operator/staff/admin email + password login
      description: Returns tokens directly, or an MFA challenge. When `mfaChallengeRequired` is true, finish with `/v1/auth/mfa/verify` (and `/v1/auth/mfa/enroll`
        first if `mfaEnrollNeeded`) using the `preAuthToken`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in, or MFA required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/auth/mfa/enroll:
    post:
      tags:
      - Auth
      operationId: enrollMfa
      summary: Start TOTP enrollment
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollMfaRequest'
      responses:
        '200':
          description: TOTP secret to scan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollMfaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/auth/mfa/verify:
    post:
      tags:
      - Auth
      operationId: verifyMfa
      summary: Complete login with a TOTP code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyMfaRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/auth/token/refresh:
    post:
      tags:
      - Auth
      operationId: refreshToken
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      summary: Revoke a refresh token
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/auth/sessions:
    get:
      tags:
      - Auth
      operationId: listSessions
      summary: List the caller's active sessions
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/sessions/{id}:
    delete:
      tags:
      - Auth
      operationId: revokeSession
      summary: Revoke one of the caller's sessions
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Session id
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/operators:
    get:
      tags:
      - Operators (admin)
      operationId: listOperators
      summary: List operators by status
      description: '**Roles:** `platform_admin`'
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        description: Defaults to `pending`.
        schema:
          $ref: '#/components/schemas/OperatorStatus'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Operators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/operators/{id}/approve:
    post:
      tags:
      - Operators (admin)
      operationId: approveOperator
      summary: Approve a pending operator
      description: '**Roles:** `platform_admin`'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Operator id
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Updated operator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/operators/{id}/reject:
    post:
      tags:
      - Operators (admin)
