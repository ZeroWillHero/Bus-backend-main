# Production stack. Lives in /opt/sl-bus on the server (copied by the deploy
# workflow — the repo is never cloned there). Needs IMAGE and DOMAIN in the
# shell env (deploy.yml sets them) plus a .env file with the app secrets.
#
# Postgres runs in this stack (no Supabase). POSTGRES_PASSWORD (superuser
# `slbus`) and SLBUS_APP_PASSWORD (the API's non-superuser role) come from
# .env; the connection URLs below are built from them, so keep both passwords
# URL-safe (openssl rand -hex 24).
x-db-urls:
  superuser: &superuser-url postgres://slbus:${POSTGRES_PASSWORD}@postgres:5432/slbus?sslmode=disable
  app: &app-url postgres://slbus_app:${SLBUS_APP_PASSWORD}@postgres:5432/slbus?sslmode=disable

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: slbus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: slbus
      SLBUS_APP_PASSWORD: ${SLBUS_APP_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Runs only on first start (empty volume): creates slbus_app with the
      # real password before migration 000005 would create it with a default.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    # No published port: only the containers in this stack can reach it.
    # Use `docker compose exec postgres psql -U slbus slbus` to get a shell.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slbus -d slbus"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.1
    # Runs as the superuser; the API uses slbus_app.
    command: ["-path", "/migrations", "-database", *superuser-url, "up"]
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${IMAGE}
    command: ["server"]
    env_file: .env
    environment:
      HTTP_ADDR: ":8080"
      REDIS_ADDR: "redis:6379"
      DATABASE_URL: *app-url
      # Caddy is the one proxy in front of the API; per-IP rate limits read
      # the X-Forwarded-For entry it appends.
      TRUSTED_PROXY_HOPS: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  worker:
    image: ${IMAGE}
    command: ["worker"]
    env_file: .env
    environment:
      # The outbox relay needs a privileged connection (cmd/worker/main.go).
      WORKER_DATABASE_URL: *superuser-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Nightly pg_dump -Fc into the db_backups volume (deploy/backup/). Off-site
  # upload is off unless BACKUP_S3_BUCKET is set in backup.env. Runbook:
  # runbooks/database-backup-restore.md. Run one now:
  #   docker compose -f docker-compose.prod.yml exec db-backup /backup/backup.sh
  db-backup:
    image: postgres:17   # same major as the server, so pg_dump matches
    entrypoint: ["/bin/sh", "/backup/entrypoint.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: slbus
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: slbus
      TZ: ${BACKUP_TZ:-Asia/Colombo}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_DIR: /backups
    # BACKUP_S3_* / AWS_* live in backup.env (written by deploy.yml), NOT in
    # .env: api and worker load all of .env, and they must never see the
    # off-site backup credentials. Optional: no file = local backups only.
    env_file:
      - path: backup.env
        required: false
    volumes:
      - ./backup:/backup:ro
      - db_backups:/backups
    healthcheck:
      # Unhealthy when the last scheduled backup failed.
      test: ["CMD-SHELL", "grep -q '^ok' /backups/.last-status"]
      interval: 5m
      timeout: 5s
      retries: 1
      start_period: 1m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8.10
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data:
  db_backups:
  redis_data:
  caddy_data:
  caddy_config:
