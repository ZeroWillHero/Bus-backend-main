        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Updated operator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/operators/{id}/suspend:
    post:
      tags:
      - Operators (admin)
      operationId: suspendOperator
      summary: Suspend an approved operator
      description: '**Roles:** `platform_admin`'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Operator id
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Updated operator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
