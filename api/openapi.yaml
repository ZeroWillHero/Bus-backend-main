      security: []
      parameters:
      - name: origin
        in: query
        required: true
        schema:
          type: string
      - name: destination
        in: query
        required: true
        schema:
          type: string
      - name: date
        in: query
        required: true
        description: Travel date, YYYY-MM-DD (UTC).
        schema:
          type: string
          format: date
      - name: sort
        in: query
        description: Defaults to `departure`.
        schema:
          type: string
          enum:
          - departure
          - price
      - name: busClass
        in: query
        schema:
          type: string
      - name: minPrice
        in: query
        schema:
          type: number
          format: double
      - name: maxPrice
        in: query
        schema:
          type: number
          format: double
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Matching trips
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultListResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/bookings:
    post:
      tags:
      - Bookings
      operationId: createBooking
      summary: Hold seats and create a booking
      description: 'Fares are recomputed server-side; any `fareAmount` sent by the client is ignored. The hold expires at `holdExpiresAt`.


        **Note:** the booking endpoints do not use the standard `{success, data}` envelope. Success responses are the bare object, and errors
        are a bare `{code, message}` (`BookingError`).


        **Roles:** `passenger`'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Seats held
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`BOOKING_SEAT_UNAVAILABLE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '422':
          description: '`VALIDATION_FAILED` (unknown/duplicate/no seats)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
  /v1/bookings/{id}:
    get:
      tags:
      - Bookings
      operationId: getBooking
      summary: Get one of the caller's bookings
      description: '**Note:** the booking endpoints do not use the standard `{success, data}` envelope. Success responses are the bare object,
        and errors are a bare `{code, message}` (`BookingError`).


        **Roles:** `passenger`'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Booking id
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          description: '`BOOKING_NOT_FOUND` (also returned for bookings owned by someone else)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
  /v1/bookings/{id}/confirm:
    post:
      tags:
      - Bookings
      operationId: confirmBooking
      summary: Confirm a held booking with a payment reference
      description: '**Note:** the booking endpoints do not use the standard `{success, data}` envelope. Success responses are the bare object,
        and errors are a bare `{code, message}` (`BookingError`).


        **Roles:** `passenger`'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Booking id
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmBookingRequest'
      responses:
        '200':
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '402':
          description: '`PAYMENT_DECLINED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: '`BOOKING_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '410':
          description: '`BOOKING_HOLD_EXPIRED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
  /v1/bookings/{id}/cancel:
    post:
      tags:
      - Bookings
      operationId: cancelBooking
      summary: Cancel a booking
      description: '**Note:** the booking endpoints do not use the standard `{success, data}` envelope. Success responses are the bare object,
        and errors are a bare `{code, message}` (`BookingError`).


        **Roles:** `passenger`'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Booking id
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          description: '`BOOKING_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
  /v1/tickets/{qrToken}/check-in:
    post:
      tags:
      - Tickets
      operationId: checkInTicket
      summary: Check a passenger in by QR token
      description: '**Note:** the booking endpoints do not use the standard `{success, data}` envelope. Success responses are the bare object,
        and errors are a bare `{code, message}` (`BookingError`).


        **Roles:** `operator_staff`'
      security:
      - bearerAuth: []
      parameters:
      - name: qrToken
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Checked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResult'
        '400':
          description: '`INVALID_QR_TOKEN`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '404':
          description: '`TICKET_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
        '409':
          description: '`TICKET_ALREADY_CHECKED_IN`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
  /v1/ws/trips/{tripID}/seats:
    get:
      tags:
      - Realtime
      operationId: subscribeSeatUpdates
      summary: Live seat status over WebSocket
      description: WebSocket upgrade. Not callable from Swagger UI and not generated into client code. Authenticate with a valid access token
        (any role) in the `token` query parameter, or in the `Sec-WebSocket-Protocol` header. The server then streams text frames, each a JSON
        `SeatStatusMessage`. The connection closes after 15 minutes.
      security: []
      parameters:
      - name: tripID
        in: path
        required: true
        description: Trip id
        schema:
          type: string
          format: uuid
      - name: token
        in: query
        required: true
        description: Access token (JWT).
        schema:
          type: string
      responses:
        '101':
          description: Switching protocols; frames are `SeatStatusMessage` JSON
        '400':
          description: Missing tripID
        '401':
          description: Missing or invalid token
      x-websocket: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `meta.nextCursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Page size (default 20).
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Request body is not valid JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: VALIDATION_FAILED
              message: Request body is not valid JSON.
    Unauthorized:
      description: Missing, invalid or expired access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: AUTH_TOKEN_INVALID
              message: Missing, invalid or expired access token.
    Forbidden:
      description: You don't have permission to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: AUTH_FORBIDDEN
              message: You don't have permission to perform this action.
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Resource not found.
    Conflict:
      description: State conflict, e.g. an invalid status transition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: INVALID_STATUS_TRANSITION
              message: State conflict, e.g. an invalid status transition.
    ValidationFailed:
      description: Validation failed. See `error.fields` for per-field issues.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: VALIDATION_FAILED
              message: Validation failed. See `error.fields` for per-field issues.
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: AUTH_OTP_RATE_LIMITED
              message: Too many requests.
  schemas:
    Meta:
      type: object
      properties:
        requestId:
          type: string
    PageMeta:
      type: object
      properties:
        requestId:
          type: string
        nextCursor:
          type: string
          description: Pass as `cursor` to fetch the next page.
        hasMore:
          type: boolean
    FieldError:
      type: object
      properties:
        field:
          type: string
        issue:
          type: string
      required:
      - field
      - issue
    ApiError:
      type: object
      properties:
        code:
          type: string
          description: Stable, namespaced error code.
          example: VALIDATION_FAILED
        message:
          type: string
          description: Safe to show to the end user.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      required:
      - code
      - message
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          description: Always `false`.
        error:
          $ref: '#/components/schemas/ApiError'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - success
      - error
    BookingError:
      type: object
      properties:
        code:
          type: string
          example: BOOKING_NOT_FOUND
        message:
          type: string
      required:
      - code
      description: Bare error body used by the booking endpoints (no envelope). Some responses may have an empty or plain-text body.
    EmptyData:
      type: object
      properties: {}
      description: Empty object.
    EmptyResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Always `true`.
        data:
          $ref: '#/components/schemas/EmptyData'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - success
      - data
    HealthData:
      type: object
      properties:
        status:
          type: string
          example: ok
      required:
      - status
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Always `true`.
        data:
          $ref: '#/components/schemas/HealthData'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - success
      - data
    Role:
      type: string
      enum:
      - passenger
      - operator_staff
      - operator_admin
      - finance_admin
      - support
      - platform_admin
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        operatorId:
          type: string
          format: uuid
          description: Present for operator roles.
      required:
      - accessToken
      - refreshToken
      - role
    TokenPairResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Always `true`.
        data:
          $ref: '#/components/schemas/TokenPair'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - success
      - data
    RegisterOperatorRequest:
