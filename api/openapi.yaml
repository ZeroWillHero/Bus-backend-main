openapi: 3.0.3
info:
  title: SL-Bus API
  version: "1.0"
  description: >
    Source of truth for the SL-Bus REST contract (ARCHITECTURE.md §6.1).
    Generates Go server interfaces and Dart client SDKs via oapi-codegen
    (TECH_STACK.md §1). Written before implementation, not derived from it.
servers:
  - url: /v1

paths:
  /healthz:
    get:
      summary: Liveness/readiness check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

components:
  schemas:
    # ENGINEERING_STANDARDS.md §1 — every response uses one of these two shapes.
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
        meta:
          $ref: "#/components/schemas/Meta"

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: "#/components/schemas/ApiError"
        meta:
          $ref: "#/components/schemas/Meta"

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Namespaced, stable error code (ENGINEERING_STANDARDS.md §3)
          example: BOOKING_SEAT_UNAVAILABLE
        message:
          type: string
          description: Human-readable, specific, safe to show to the end user
        fields:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string

    Meta:
      type: object
      properties:
        requestId:
          type: string
        nextCursor:
          type: string
        hasMore:
          type: boolean

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

# TODO(phase-1): add /auth/otp/request, /auth/otp/verify, /auth/login,
#   /auth/mfa/verify, /auth/token/refresh per AUTHENTICATION_DESIGN.md.
# TODO(phase-2): add /trips/search, /operators/{id}/... per SRS.md FR-SRCH/FR-FLT.
# TODO(phase-3): add /bookings, /bookings/confirm per SRS.md FR-BKG, with the
#   Idempotency-Key header requirement from ENGINEERING_STANDARDS.md §5.
