      summary: Replace a bus's seat map
      description: '**Roles:** `operator_admin`, `platform_admin`'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Bus id
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceSeatMapRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
