  /v1/fleet/buses/{id}:
    get:
      tags:
      - Fleet
      operationId: getBus
      summary: Get a bus
      description: '**Roles:** `operator_admin`, `platform_admin`'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Bus id
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Fleet
      operationId: updateBus
      summary: Update a bus (full replace of editable fields)
      description: '**Roles:** `operator_admin`, `platform_admin`'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Bus id
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/fleet/buses/{id}/seat-map:
    get:
      tags:
      - Fleet
      operationId: getSeatMap
      summary: Get a bus's seat map
      description: '**Roles:** `operator_admin`, `platform_admin`'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Bus id
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatMapResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
