name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE_NAME: sl-bus-backend

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose, Caddyfile, Postgres init, backup scripts and migrations
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile,deploy/postgres-init,deploy/backup,db/migrations"
          target: /opt/sl-bus
          strip_components: 0

      - name: Write .env and deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          DOMAIN: ${{ secrets.DOMAIN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SLBUS_APP_PASSWORD: ${{ secrets.SLBUS_APP_PASSWORD }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          QR_TOKEN_SECRET: ${{ secrets.QR_TOKEN_SECRET }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS || 'http://localhost:8081' }}
          # Creates the first platform_admin on boot; a no-op once one exists
          # (cmd/server/bootstrap_admin.go). Leave the secrets unset to skip.
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          # Optional off-site copy of the nightly DB backup (db-backup service,
          # runbooks/database-backup-restore.md). Leave BACKUP_S3_BUCKET unset
          # to keep backups on the server only.
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_PREFIX: ${{ secrets.BACKUP_S3_PREFIX }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE,DOMAIN,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,POSTGRES_PASSWORD,SLBUS_APP_PASSWORD,JWT_SIGNING_KEY,QR_TOKEN_SECRET,CORS_ALLOWED_ORIGINS,BOOTSTRAP_ADMIN_EMAIL,BOOTSTRAP_ADMIN_PASSWORD,BACKUP_S3_BUCKET,BACKUP_S3_ENDPOINT,BACKUP_S3_REGION,BACKUP_S3_PREFIX,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/sl-bus
            mv -f deploy/docker-compose.prod.yml docker-compose.prod.yml
            mv -f deploy/Caddyfile Caddyfile
            rm -rf postgres-init
            mv deploy/postgres-init postgres-init
            rm -rf backup
            mv deploy/backup backup
            rmdir deploy

            umask 077
            {
              echo "APP_ENV=production"
              echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
              echo "SLBUS_APP_PASSWORD=${SLBUS_APP_PASSWORD}"
              echo "JWT_SIGNING_KEY=${JWT_SIGNING_KEY}"
              echo "QR_TOKEN_SECRET=${QR_TOKEN_SECRET}"
              echo "CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}"
              echo "DOMAIN=${DOMAIN}"
              echo "IMAGE=${IMAGE}"
              echo "BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL}"
              echo "BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD}"
            } > .env

            # Backup credentials go to their own file, loaded only by the
            # db-backup service (api/worker load all of .env).
            {
              echo "BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET}"
              echo "BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT}"
              echo "BACKUP_S3_REGION=${BACKUP_S3_REGION}"
              echo "BACKUP_S3_PREFIX=${BACKUP_S3_PREFIX}"
              echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
              echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
            } > backup.env

            echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "https://${{ secrets.DOMAIN }}/healthz"; then exit 0; fi
            sleep 10
          done
          echo "healthz did not come up"; exit 1
